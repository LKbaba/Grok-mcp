name: Publish to npm

# 打 v* 标签时自动发布到 npm（使用 OIDC Trusted Publishing，无需 token）
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # 权限收到 job 级，遵循最小权限原则（仅发布 job 拥有 OIDC 写入）
    permissions:
      id-token: write   # OIDC 铸造短期令牌所必需
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 必须用 v6：v4 会往 .npmrc 写空的 _authToken，导致 npm 跳过 OIDC 交换 → 403
      - uses: actions/setup-node@v6
        with:
          node-version: '24'                        # Node 24 自带兼容 OIDC 的 npm(>=11.5.1)
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false              # 发布流程关掉包缓存，避免干扰

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      # 诊断：确认 npm 版本、.npmrc 是否残留 _authToken、OIDC 环境是否就绪
      - name: 诊断环境
        run: |
          echo "node: $(node -v)  npm: $(npm -v)"
          echo "--- 用户级 .npmrc (${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}) ---"
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" 2>/dev/null || echo "(无)"
          echo "--- 项目级 .npmrc ---"
          cat .npmrc 2>/dev/null || echo "(无)"
          echo "OIDC 请求地址是否存在: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"

      # Trusted Publishing：检测到 id-token 权限 + npm 侧已配置可信发布者时自动走 OIDC
      - name: 发布
        run: npm publish --provenance --access public --loglevel verbose

      # 失败时打印 npm 完整调试日志，拿到真实的 403 原因
      - name: 失败时打印调试日志
        if: failure()
        run: |
          echo "=== npm debug log ==="
          tail -n 80 /home/runner/.npm/_logs/*.log 2>/dev/null || echo "(无日志)"
