name: Publish to npm

# 打 v* 标签时自动发布到 npm（使用 OIDC Trusted Publishing，无需 token）
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # 权限收到 job 级，遵循最小权限原则（仅发布 job 拥有 OIDC 写入）
    permissions:
      id-token: write   # OIDC 铸造短期令牌所必需
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 必须用 v6：v4 会往 .npmrc 写空的 _authToken，导致 npm 跳过 OIDC 交换 → 403
      - uses: actions/setup-node@v6
        with:
          node-version: '24'                        # Node 24 自带兼容 OIDC 的 npm(>=11.5.1)
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false              # 发布流程关掉包缓存，避免干扰

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      # 关键：清掉 setup-node 写入的占位 _authToken，只保留 registry。
      # 否则 npm 在 PUT 时会用这个假 token 覆盖 OIDC 令牌，导致 403。
      - name: 清理 .npmrc 强制走 OIDC
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          echo "--- 清理后 .npmrc ---"
          cat "$NPM_CONFIG_USERCONFIG"

      # Trusted Publishing：检测到 id-token 权限 + npm 侧已配置可信发布者时自动走 OIDC
      - name: 发布
        run: npm publish --provenance --access public --loglevel verbose

      # 失败时打印 npm 完整调试日志，拿到真实的 403 原因
      - name: 失败时打印调试日志
        if: failure()
        run: |
          echo "=== npm debug log ==="
          tail -n 80 /home/runner/.npm/_logs/*.log 2>/dev/null || echo "(无日志)"
